---
- name: Ensure PostgreSQL listens on all interfaces
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
  notify: restart postgresql

- name: Allow remote PostgreSQL connections
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/pg_hba.conf"
    line: "host all all 0.0.0.0/0 scram-sha-256"
    state: present
  notify: restart postgresql
